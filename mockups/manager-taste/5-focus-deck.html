<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=1790703660">
<style>
  /* Direction 5: tone work with one hand on the guitar. One block fills
     the stage at the device's parameter-screen scale. The mouse wheel
     turns the control under the pointer, like the encoder. ⌘K finds any
     block, parameter or preset by name. */
  body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--bar-h) auto 1fr; height: 100vh; height: 100dvh; overflow: hidden; }

  .cmdbtn { flex: 0 1 460px; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--rule-strong); background: var(--recess); color: var(--muted); font: 500 14px/1 var(--f-body); text-align: left; margin-left: 12px; }
  .cmdbtn:hover { border-color: var(--bone-2); color: var(--bone-2); }
  .cmdbtn span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chipbar { padding: 10px var(--gut); border-bottom: 1px solid var(--rule); background: var(--recess); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 316px; min-height: 0; }
  .stage { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; border-top: 4px solid var(--fam); }
  .id { display: flex; align-items: flex-end; gap: 18px; padding: 20px var(--gut) 16px; flex-wrap: wrap; }
  .id__name { display: grid; gap: 8px; min-width: 0; }
  .id__name .tag { justify-self: start; background: var(--fam); color: var(--ground); }
  .id__name h1 { margin: 0; font: 800 64px/.9 var(--f-cond); text-transform: uppercase; letter-spacing: .005em; }
  .id__name p { margin: 0; font: 500 15px/1.3 var(--f-body); color: var(--bone-2); }
  .id .push { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .onoff { height: 52px; min-width: 150px; font-size: 18px; }
  .onoff[aria-pressed="true"] { background: var(--bone); color: var(--ground); border-color: var(--bone); }
  .ab .btn { width: 52px; height: 52px; font-size: 20px; }
  .ab .btn[aria-pressed="true"] { background: var(--plate-hi); box-shadow: inset 0 -4px 0 var(--fam); }
  .ab small { display: block; font: 600 11px/1 var(--f-cond); letter-spacing: .14em; color: var(--muted); text-align: center; margin-top: 4px; text-transform: uppercase; }

  .deck { overflow-y: auto; padding: 0 var(--gut) 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; align-content: start; scrollbar-width: thin; scrollbar-color: var(--rule-strong) transparent; }
  .deck .ctl { padding: 18px 20px 16px; gap: 10px; }
  .deck .ctl__val { font-size: 60px; }
  .deck .ctl__val small { font-size: 18px; }
  .deck .ctl__lbl { font-size: 14px; }
  .deck .scale { height: 38px; }
  .deck .scale__ticks { height: 10px; }
  .deck .scale__track { top: 20px; height: 9px; }
  .deck .scale__thumb { top: -9px; height: 27px; width: 10px; margin-left: -5px; }
  .deck .eq-edit { grid-column: 1 / -1; }

  .ctxrail { display: flex; align-items: center; gap: 12px; padding: 12px var(--gut); border-top: 1px solid var(--rule); background: var(--ground); min-height: 76px; }
  .ctxrail .cur { display: grid; gap: 4px; min-width: 150px; }
  .ctxrail .cur span { font: 600 12px/1 var(--f-cond); letter-spacing: .16em; color: var(--lamp-light); text-transform: uppercase; }
  .ctxrail .cur b { font: 700 34px/1 var(--f-cond); white-space: nowrap; }
  .ctxrail .hint { font: 500 13px/1.4 var(--f-body); color: var(--muted); }
  .ctxrail .push { margin-left: auto; display: flex; gap: 6px; align-items: center; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .trail { display: flex; gap: 6px; }
  .trail button { flex: none; height: 32px; padding: 0 10px; border: 1px solid var(--rule); border-top: 3px solid var(--fam); background: var(--plate); font: 600 12.5px/1 var(--f-body); color: var(--bone-2); white-space: nowrap; }
  .trail button b { color: var(--bone); font-weight: 600; }
  .ctxrail .edit { display: flex; gap: 6px; flex: none; }
  .trail-lbl { font: 600 12px/1 var(--f-cond); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; flex: none; }

  .side { border-left: 1px solid var(--rule); background: var(--recess); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .side h2 { margin: 0; font: 700 14px/1 var(--f-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--bone-2); display: flex; align-items: center; justify-content: space-between; }
  .fs4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; isolation: isolate; }
  .fs4 .tile { min-height: 104px; padding: 10px 12px; }
  .fs4 .tile.is-edit:not(.is-live) { padding: 9px 11px; }
  .fs4 .tile__name { font-size: 20px; }
  .fs4 .strip { display: none; }
  .fs4 .tile__top { flex-wrap: wrap; gap: 4px; }
  .fs4 .tag { height: 20px; font-size: 11px; padding: 0 6px; }
  .bankstep { display: flex; }
  .bankstep .mid { flex: 1; display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font: 700 18px/1 var(--f-cond); background: var(--ground); }
  .side .scn { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .side .scn .btn { height: 48px; justify-content: flex-start; }
  .side .scn .btn[aria-pressed="true"] { background: var(--bone); color: var(--ground); border-color: var(--bone); }
  .side .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font: 500 13px/1.2 var(--f-body); color: var(--bone-2); align-items: center; }
  .keys span:nth-child(odd) { display: flex; gap: 3px; }

  /* Command palette */
  .pal-scrim { position: fixed; inset: 0; background: rgba(5, 5, 6, .66); z-index: 100; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0; }
  .pal { width: min(640px, 100%); background: var(--plate); border: 1px solid var(--rule-strong); box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .9); animation: pal .18s var(--ease); }
  @keyframes pal { from { transform: translateY(-8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .pal .search { border: 0; border-bottom: 1px solid var(--rule); height: 56px; padding: 0 16px; }
  .pal .search input { font-size: 18px; }
  .pal ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
  .pal li button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 10px; border: 0; background: none; text-align: left; }
  .pal li button.is-hl { background: var(--plate-hi); outline: 1px solid var(--rule-strong); }
  .pal .code { width: 46px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--fam); color: var(--ground); font: 500 10.5px/1 var(--f-mono); }
  .pal .code.cmd { background: var(--plate-hi); color: var(--bone-2); }
  .pal b { font: 700 17px/1.1 var(--f-cond); text-transform: uppercase; flex: 1; }
  .pal small { font: 500 12.5px/1 var(--f-body); color: var(--muted); }
  .pal .foot { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--rule); font: 500 12px/1 var(--f-body); color: var(--muted); }

  @media (max-width: 1500px) { .appbar .where span { display: none; } }
  @media (max-width: 1180px) { .layout { grid-template-columns: minmax(0, 1fr) 260px; } .id__name h1 { font-size: 48px; } }
  @media (max-width: 720px) {
    body { display: block; height: auto; overflow: auto; padding-bottom: 96px; }
    .appbar .where, .appbar .conn, .appbar .tag, .appbar .btn--sm { display: none; }
    .cmdbtn { flex: 1; margin-left: 4px; }
    .cmdbtn .kbd { display: none; }
    .layout { display: block; }
    .id { padding: 16px var(--gut) 12px; gap: 12px; }
    .id__name h1 { font-size: 40px; }
    .id .push { margin: 0; width: 100%; }
    .onoff { flex: 1; }
    .deck { grid-template-columns: 1fr; gap: 8px; overflow: visible; }
    .deck .ctl__val { font-size: 44px; }
    .ctxrail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; min-height: 0; padding: 10px var(--gut); }
    .ctxrail .hint, .ctxrail .trail, .ctxrail .trail-lbl { display: none; }
    .ctxrail .cur b { font-size: 26px; }
    .side { border-left: 0; border-top: 1px solid var(--rule); }
    .side .keys { display: none; }
    .ctxrail [data-act="exp"], .ctxrail [data-act="midi"], .ctxrail .edit { display: none; }
  }
</style>
</head>
<body data-wheel="hover">
<header class="appbar" id="bar"></header>
<div class="chipbar scroll-x" id="chips"></div>
<div class="layout"><main class="stage" id="stage"></main><aside class="side" id="side" aria-label="Presets and scenes"></aside></div>
<div id="pal"></div>

<script src="data.js?v=1790703660"></script>
<script src="core.js?v=1790703660"></script>
<script src="render.js?v=1790703660"></script>
<script src="chrome.js?v=1790703660"></script>
<script src="interact.js?v=1790703660"></script>
<script>
(function () {
  "use strict";
  const A = window.Ardor;
  const esc = A.esc;
  const DEFS = A.DEFS;
  let bankIndex = 0;
  let recent = [];
  const ab = {};
  let pal = null;

  // Keep a trail of the last tweaks: one entry per control, newest first.
  const setParam = A.setParam;
  A.setParam = (uid, key, value, opts) => {
    setParam(uid, key, value, opts);
    recent = [{ uid, key }, ...recent.filter((r) => !(r.uid === uid && r.key === key))].slice(0, 5);
  };

  A.acts.bank = (el) => { bankIndex = Math.max(0, Math.min(A.get().banks.length - 1, bankIndex + Number(el.dataset.dir))); A.repaint(); };
  A.acts.step = (el) => {
    const all = A.allBlocks(A.cur()).filter((b) => !b.lanes);
    const i = all.findIndex((b) => b.uid === A.get().sel);
    const next = all[(i + Number(el.dataset.dir) + all.length) % all.length];
    A.view({ sel: next.uid });
  };
  A.acts.trail = (el) => {
    A.view({ sel: el.dataset.uid, focusCtl: `${el.dataset.uid}:${el.dataset.key}` });
    requestAnimationFrame(() => document.querySelector(`.scale[data-uid="${CSS.escape(el.dataset.uid)}"][data-key="${el.dataset.key}"]`)?.focus());
  };
  A.acts.fine = (el) => {
    const [uid, key] = (A.get().focusCtl || "").split(":");
    const sc = document.querySelector(`.scale[data-uid="${CSS.escape(uid)}"][data-key="${key}"]`);
    sc?.dispatchEvent(new KeyboardEvent("keydown", { key: el.dataset.d === "1" ? "ArrowRight" : "ArrowLeft", shiftKey: true, bubbles: true }));
  };
  A.acts.reset = () => {
    const [uid, key] = (A.get().focusCtl || "").split(":");
    const hit = A.locate(A.cur(), uid);
    const prm = hit && A.param(hit.block.def, key);
    if (prm) { A.setParam(uid, key, prm.def); A.toast(`${prm.label} reset to ${A.fmtText(prm, prm.def)}`); }
  };
  A.acts.exp = () => A.toast("Move the expression pedal from heel to toe to set the range");
  A.acts.midi = () => A.toast("Waiting for a MIDI CC. Move a controller now.");

  // A/B: two sets of values for the selected block. Switching swaps them in.
  A.acts.ab = (el) => {
    const s = A.get();
    const hit = A.locate(A.cur(), s.sel);
    if (!hit) return;
    const slot = el.dataset.slot;
    const cur = ab[s.sel] || { cur: "A", A: null, B: null };
    if (cur.cur === slot) return;
    const next = { ...cur, [cur.cur]: hit.block.v, cur: slot };
    const values = next[slot] || hit.block.v;
    ab[s.sel] = next;
    A.edit((p) => A.mapBlock(p, s.sel, (b) => ({ ...b, v: { ...values } })));
    A.toast(`${A.blockName(hit.block)}: now on ${slot}`);
  };

  /* ---------- command palette ---------- */
  function commands() {
    const s = A.get();
    const p = A.cur();
    const sel = s.sel ? A.locate(p, s.sel) : null;
    const out = [];
    A.allBlocks(p).filter((b) => !b.lanes).forEach((b) => {
      out.push({ label: `Go to ${A.blockName(b)}`, sub: DEFS[b.def].cap, code: A.blockCode(b), fam: DEFS[b.def].fam, run: () => A.view({ sel: b.uid }) });
      DEFS[b.def].params.forEach((prm) => out.push({ label: `${A.blockName(b)} · ${prm.label}`, sub: A.fmtText(prm, A.val(p, b, prm.key, s.scene)), code: A.blockCode(b), fam: DEFS[b.def].fam, run: () => A.acts.trail({ dataset: { uid: b.uid, key: prm.key } }) }));
    });
    Object.values(DEFS).filter((d) => d.id !== "global" && d.id !== "dualAmp").forEach((d) => out.push({
      label: `Add ${d.name}${sel ? ` after ${A.blockName(sel.block)}` : ""}`, sub: d.cap, code: d.code, fam: d.fam,
      run: () => { const h = sel || { listId: "main", index: p.blocks.length - 1 }; if (!A.add(d.id, h.listId, h.index + 1).length) A.toast(`${d.name} added`); },
    }));
    Object.values(s.presets).forEach((x) => out.push({ label: `Open ${x.name}`, sub: `Bank ${String(A.slotOf(x.id).bank).padStart(2, "0")} · FS ${A.slotOf(x.id).slot}`, code: "PRE", fam: null, run: () => A.selectPreset(x.id) }));
    if (sel) out.push({ label: `${A.isOn(p, sel.block, s.scene) ? "Bypass" : "Turn on"} ${A.blockName(sel.block)}`, sub: "B", code: "CMD", fam: null, run: () => A.toggle(sel.block.uid) });
    out.push({ label: "Save preset", sub: "⌘S", code: "CMD", fam: null, run: () => A.save() });
    out.push({ label: "Load on pedal", sub: "Make this preset live", code: "CMD", fam: null, run: () => A.makeLive() });
    return out;
  }
  function renderPal() {
    const q = pal.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const all = commands();
    pal.items = (q.length ? all.filter((c) => q.every((w) => `${c.label} ${c.sub}`.toLowerCase().includes(w))) : all.filter((c) => c.label.startsWith("Go to") || c.code === "CMD")).slice(0, 9);
    pal.hl = Math.min(pal.hl, Math.max(0, pal.items.length - 1));
    document.querySelector(".pal ul").innerHTML = pal.items.map((c, i) => `<li><button class="${i === pal.hl ? "is-hl" : ""} ${c.fam ? `f-${c.fam}` : ""}" data-act="palrun" data-i="${i}"><span class="code ${c.fam ? "" : "cmd"}">${esc(c.code)}</span><b>${esc(c.label)}</b><small>${esc(c.sub)}</small></button></li>`).join("")
      || '<li><p class="note" style="padding:14px 10px">Nothing matches. Try a block name, a parameter such as “mix”, or a preset name.</p></li>';
  }
  function openPal() {
    pal = { q: "", hl: 0, items: [] };
    document.getElementById("pal").innerHTML = `<div class="pal-scrim" data-act="palclose"><div class="pal" role="dialog" aria-label="Command bar">
      <label class="search">${A.icon("search")}<input id="palq" placeholder="Block, parameter or preset. Try “delay mix”" aria-label="Command" autocomplete="off"></label>
      <ul role="listbox"></ul><div class="foot"><span><b class="kbd">↑</b><b class="kbd">↓</b> move</span><span><b class="kbd">↵</b> run</span><span><b class="kbd">Esc</b> close</span></div></div></div>`;
    renderPal();
    const input = document.getElementById("palq");
    input.focus();
    input.addEventListener("input", () => { pal.q = input.value; pal.hl = 0; renderPal(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); pal.hl = (pal.hl + (e.key === "ArrowDown" ? 1 : -1) + pal.items.length) % Math.max(1, pal.items.length); renderPal(); }
      if (e.key === "Enter") { e.preventDefault(); runPal(pal.hl); }
      if (e.key === "Escape") { e.preventDefault(); closePal(); }
    });
  }
  const closePal = () => { pal = null; document.getElementById("pal").innerHTML = ""; };
  const runPal = (i) => { const c = pal?.items[i]; closePal(); c?.run(); };
  A.acts.palrun = (el) => runPal(Number(el.dataset.i));
  A.acts.palclose = (el, ev) => { if (ev.target === el) closePal(); };
  A.acts.cmd = () => openPal();
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (pal) closePal(); else openPal(); }
  }, true);
  A.keys["/"] = (e) => { e.preventDefault(); openPal(); return true; };
  A.keys["["] = () => { A.acts.step({ dataset: { dir: -1 } }); return true; };
  A.keys["]"] = () => { A.acts.step({ dataset: { dir: 1 } }); return true; };
  A.keys.Escape = () => { if (pal) { closePal(); return true; } return true; };

  /* ---------- views ---------- */
  function stage(s, p) {
    let hit = s.sel ? A.locate(p, s.sel) : null;
    if (!hit || hit.block.lanes) { const first = A.allBlocks(p).find((b) => !b.lanes); if (first) { hit = A.locate(p, first.uid); } }
    if (!hit) return `<div class="id"><div class="id__name"><h1>Empty chain</h1><p>Press ⌘K and type a block name to add it.</p></div></div>`;
    const b = hit.block;
    const def = DEFS[b.def];
    const on = A.isOn(p, b, s.scene);
    const all = A.allBlocks(p).filter((x) => !x.lanes);
    const cur = ab[b.uid]?.cur || "A";
    const fc = s.focusCtl && s.focusCtl.startsWith(`${b.uid}:`) ? s.focusCtl.split(":")[1] : null;
    const fp = fc ? A.param(b.def, fc) : null;
    const trail = recent.map((r) => {
      const h = A.locate(p, r.uid);
      const prm = h && A.param(h.block.def, r.key);
      return prm ? `<button class="f-${DEFS[h.block.def].fam}" data-act="trail" data-uid="${r.uid}" data-key="${r.key}">${esc(A.blockCode(h.block))} ${esc(prm.label)} <b>${A.fmtText(prm, A.val(p, h.block, r.key, s.scene))}</b></button>` : "";
    }).join("");
    return `<div class="id ${A.famClass(b)}">
        <div class="id__name"><span class="tag">${esc(def.cap)}</span><h1>${esc(A.blockName(b))}</h1>
          <p>${b.asset ? `${esc(def.name)} · ` : ""}Block ${all.findIndex((x) => x.uid === b.uid) + 1} of ${all.length}${hit.listId !== "main" ? ` · Dual Rig lane ${hit.listId.split(":")[1].toUpperCase()}` : ""}</p></div>
        <span class="push">
          <button class="btn btn--icon btn--lg" data-act="step" data-dir="-1" aria-label="Previous block" title="Previous block ([)">${A.icon("left")}</button>
          <button class="btn btn--icon btn--lg" data-act="step" data-dir="1" aria-label="Next block" title="Next block (])">${A.icon("right")}</button>
          <div class="ab"><div class="seg"><button class="btn" data-act="ab" data-slot="A" aria-pressed="${cur === "A"}">A</button><button class="btn" data-act="ab" data-slot="B" aria-pressed="${cur === "B"}">B</button></div><small>Compare</small></div>
          <button class="btn onoff" data-act="toggle" data-uid="${b.uid}" aria-pressed="${on}">${A.icon("power")}Block ${on ? "on" : "off"}</button>
          <button class="btn btn--icon btn--lg" data-act="dup" data-uid="${b.uid}" aria-label="Duplicate">${A.icon("copy")}</button>
          <button class="btn btn--icon btn--lg btn--danger" data-act="remove" data-uid="${b.uid}" aria-label="Delete">${A.icon("trash")}</button>
        </span></div>
      <div class="deck ${A.famClass(b)}" data-keep-scroll="deck">${A.controls(p, b, { scene: s.scene, eqH: 220 })}</div>
      <div class="ctxrail">
        ${fp ? `<div class="cur"><span>${esc(fp.label)}</span><b>${A.fmtText(fp, A.val(p, b, fc, s.scene))}</b></div>
          <button class="btn btn--icon" data-act="fine" data-d="-1" aria-label="Fine decrease">${A.icon("left")}</button><button class="btn btn--icon" data-act="fine" data-d="1" aria-label="Fine increase">${A.icon("right")}</button>
          <button class="btn" data-act="reset">${A.icon("reset")}Reset</button><button class="btn" data-act="exp">${A.icon("pedal")}EXP</button><button class="btn" data-act="midi">${A.icon("midi")}MIDI</button>`
        : '<span class="hint">Point at a control and turn the mouse wheel, like the encoder. Hold Shift for fine steps. Double-click resets.</span>'}
        <span class="push">${trail ? `<span class="trail-lbl">Recent</span><div class="trail">${trail}</div>` : ""}</span>
        <span class="edit">${A.editTools()}</span>
      </div>`;
  }

  function side(s, p) {
    const bank = s.banks[bankIndex];
    const live = s.live.presetId === p.id ? s.live.sceneId : null;
    return `<h2>Bank <span class="tag tag--line">FS 1 to 4</span></h2>
      <div class="bankstep"><button class="btn btn--icon" data-act="bank" data-dir="-1" aria-label="Previous bank">${A.icon("left")}</button><span class="mid">BANK ${String(bank.n).padStart(2, "0")} ${esc(bank.name ? `· ${bank.name}` : "")}</span><button class="btn btn--icon" data-act="bank" data-dir="1" aria-label="Next bank">${A.icon("right")}</button></div>
      <div class="fs4">${[0, 2, 1, 3].map((i) => A.tile(bank.slots[i], { fs: `FS ${i + 1}`, bank: bank.n, slot: i + 1 })).join("")}</div>
      ${p.scenes ? `<h2>Scenes <span class="tag tag--line">Edit scope</span></h2><div class="scn">
        <button class="btn" data-act="scene" data-scene="" aria-pressed="${!s.scene}" style="grid-column:1/-1">Preset values</button>
        ${p.scenes.map((sc, i) => `<button class="btn" data-act="scene" data-scene="${sc.id}" aria-pressed="${s.scene === sc.id}">${i + 1} ${esc(sc.name)}${live === sc.id ? '<i class="lampdot"></i>' : ""}</button>`).join("")}</div>` : ""}
      <h2>Keys</h2>
      <div class="keys"><span><b class="kbd">⌘</b><b class="kbd">K</b></span>Find anything<span><b class="kbd">[</b><b class="kbd">]</b></span>Previous and next block<span><b class="kbd">B</b></span>Bypass<span><b class="kbd">⌥</b><b class="kbd">←</b><b class="kbd">→</b></span>Move block<span><b class="kbd">⌘</b><b class="kbd">Z</b></span>Undo</div>
      `;
  }

  A.mount((s) => {
    const p = A.cur();
    if (!s.sel || !A.locate(p, s.sel)) {
      const first = A.allBlocks(p).find((b) => !b.lanes);
      if (first && s.sel !== first.uid) { queueMicrotask(() => A.view({ sel: first.uid })); }
    }
    const bi = s.banks.findIndex((b) => b.slots.includes(s.editId));
    if (bi >= 0 && document.body.dataset.bank !== s.editId) { bankIndex = bi; document.body.dataset.bank = s.editId; }
    document.getElementById("bar").innerHTML = `${A.mark()}${A.mockflag(5)}${A.presetTitle()}
      <button class="cmdbtn" data-act="cmd">${A.icon("search")}<span>Block, parameter or preset</span><b class="kbd">⌘K</b></button>
      <span class="push"></span>${A.dirtyTag()}${A.liveState()}${A.conn()}`;
    document.getElementById("chips").innerHTML = A.chips(p, { sel: s.sel, scene: s.scene });
    const selHit = s.sel ? A.locate(p, s.sel) : null;
    document.getElementById("stage").className = `stage ${selHit && !selHit.block.lanes ? A.famClass(selHit.block) : ""}`;
    document.getElementById("stage").innerHTML = stage(s, p);
    document.getElementById("side").innerHTML = side(s, p);
  });
})();
</script>
</body>
</html>
