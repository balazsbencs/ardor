<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:var(--font-sans);color:var(--foreground);margin:0}figure{margin:0}figcaption{font-weight:600;font-size:16px;margin-bottom:6px}.note{color:var(--muted-foreground);font-size:12px;line-height:1.5;margin:0 0 18px}.row{margin:14px 0}.label{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}.label span:last-child{font-family:var(--font-mono)}.track{height:20px;background:var(--secondary);position:relative;border-radius:3px}.track:after{content:"";position:absolute;left:53.3333%;top:-4px;bottom:-4px;border-left:2px dashed var(--foreground)}.bar{height:100%;border-radius:3px}.ticks{height:38px;position:relative;font-size:12px;color:var(--muted-foreground);margin-top:12px}.zero{position:absolute;left:0}.limit{position:absolute;left:53.3333%;transform:translateX(-50%);text-align:center;color:var(--foreground)}.end{position:absolute;right:0}.foot{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin-top:10px}
</style></head><body><figure><figcaption>HyperWaveNet on Raspberry Pi 4</figcaption><p class="note">48 kHz · 128 frames · 99.9th-percentile processing time</p><div class="row"><div class="label"><span>Lite CPU · steady playback</span><span>1.48 ms</span></div><div class="track" role="img" aria-label="Lite CPU · steady playback: 1.48 milliseconds, deadline 2.67 milliseconds"><div class="bar" style="width:29.652%;background:var(--success)"></div></div></div><div class="row"><div class="label"><span>Lite CPU · all six controls change</span><span>1.71 ms</span></div><div class="track" role="img" aria-label="Lite CPU · all six controls change: 1.71 milliseconds, deadline 2.67 milliseconds"><div class="bar" style="width:34.223%;background:var(--success)"></div></div></div><div class="row"><div class="label"><span>HD · steady playback</span><span>3.75 ms</span></div><div class="track" role="img" aria-label="HD · steady playback: 3.75 milliseconds, deadline 2.67 milliseconds"><div class="bar" style="width:74.965%;background:var(--destructive)"></div></div></div><div class="row"><div class="label"><span>HD · all six controls change</span><span>4.25 ms</span></div><div class="track" role="img" aria-label="HD · all six controls change: 4.25 milliseconds, deadline 2.67 milliseconds"><div class="bar" style="width:85.003%;background:var(--destructive)"></div></div></div><div class="ticks"><span class="zero">0</span><span class="limit">2.67 ms<br>audio deadline</span><span class="end">5 ms</span></div><p class="foot">Lite CPU: zero deadline misses across 10,000 measured blocks. HD: all 10,000 blocks exceeded the deadline. Processor-only measurements; the separate Codec Zero test included a cabinet.</p></figure></body></html>
