name: NAM CLAP

on:
  workflow_dispatch:
  pull_request:
    paths: ['plugins/nam-clap/**', 'plugins/ardor-clap/RateAdapter.*', 'src/dsp/NamProcessor.*', 'src/namparam/**', 'src/preset/NamMetadata.h', 'tests/fixtures/parametric-trainer*', 'assets/nam/**', '.github/workflows/nam-clap.yml']
  push:
    branches: [main]
    paths: ['plugins/nam-clap/**', 'src/dsp/NamProcessor.*', 'src/namparam/**', 'src/preset/NamMetadata.h', '.github/workflows/nam-clap.yml']

permissions:
  contents: read
concurrency:
  group: nam-clap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: NAM loader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use GitHub mirror for Eigen
        run: git config --global url."https://github.com/eigen-mirror/eigen.git".insteadOf https://gitlab.com/libeigen/eigen
      - name: Configure standalone loader
        run: cmake -S plugins/nam-clap -B build-nam-clap -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
      - name: Build plugin and test hosts
        run: cmake --build build-nam-clap --parallel 2
      - name: Check models, automation, project recall, audio and native editor
        env:
          ARDOR_NAM_SCREENSHOTS: ${{ runner.temp }}/nam-clap-checks
        run: ctest --test-dir build-nam-clap --output-on-failure
      - name: Run full upstream CLAP validator
        run: |
          python3 - <<'PYTHON'
          import hashlib, io, json, os, pathlib, subprocess, tarfile, zipfile
          assets = {
              'Linux': ('ubuntu-22.04', '49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90'),
              'macOS': ('macos-15-aarch64', '719a0248ea431718bb7c92c8a0b9a78afa0bb23d692cf452e80973fe8b89282d'),
          }
          platform, expected = assets[os.environ['RUNNER_OS']]
          url = f'https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-{platform}.zip'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'clap-validator'
          root.mkdir(parents=True, exist_ok=True)
          archive = root / 'validator.zip'
          # Hosted runners can temporarily lose DNS, including after a successful build.
          subprocess.run(['curl', '--fail', '--location', '--retry', '5', '--retry-all-errors',
                          '--connect-timeout', '15', '--max-time', '120',
                          '--output', str(archive), url], check=True)
          data = archive.read_bytes()
          assert hashlib.sha256(data).hexdigest() == expected, 'Validator archive checksum mismatch'
          zipfile.ZipFile(io.BytesIO(data)).extractall(root)
          # Unix release zips wrap a tarball; Windows contains the executable.
          for archive in root.rglob('*.tar.gz'):
              with tarfile.open(archive) as tar:
                  member = next(m for m in tar.getmembers() if m.isfile() and pathlib.PurePosixPath(m.name).name == 'clap-validator')
                  (root / 'clap-validator').write_bytes(tar.extractfile(member).read())
          executable = next(p for p in root.rglob('*') if p.name in ('clap-validator', 'clap-validator.exe') and p.is_file())
          executable.chmod(0o755)
          plugin = pathlib.Path('build-nam-clap/ArdorNAM.clap')
          run = subprocess.run([str(executable), 'validate', '--json', str(plugin.resolve())], capture_output=True, text=True, encoding='utf-8', errors='replace')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nam-clap-checks'
          output.mkdir(exist_ok=True)
          (output / 'validator.json').write_text(run.stdout, encoding='utf-8')
          (output / 'validator.log').write_text(run.stderr, encoding='utf-8')
          print(run.stderr)
          assert run.returncode == 0, 'Full CLAP validation failed'
          results = json.loads(run.stdout)['results']
          assert all(r['status']['code'] in ('success', 'skipped') for r in results), 'Validator failure or warning'
          print('Validator:', sum(r['status']['code'] == 'success' for r in results), 'passed;', sum(r['status']['code'] == 'skipped' for r in results), 'skipped')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ArdorNAM-checks-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/nam-clap-checks/
          if-no-files-found: warn
          retention-days: 30
      - name: Stage plugin and license notices
        run: |
          cmake --install build-nam-clap --prefix "$RUNNER_TEMP/ArdorNAM"
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/ArdorNAM/README.md"
      - name: Verify and package Apple Silicon plugin
        if: runner.os == 'macOS'
        run: |
          binary="$RUNNER_TEMP/ArdorNAM/ArdorNAM.clap/Contents/MacOS/ArdorNAM"
          test "$(lipo -archs "$binary")" = arm64
          codesign --force --sign - "$RUNNER_TEMP/ArdorNAM/ArdorNAM.clap"
          codesign --verify --strict "$RUNNER_TEMP/ArdorNAM/ArdorNAM.clap"
          plutil -lint "$RUNNER_TEMP/ArdorNAM/ArdorNAM.clap/Contents/Info.plist"
          python3 - <<'PYTHON'
          import os, subprocess
          binary = os.environ['RUNNER_TEMP'] + '/ArdorNAM/ArdorNAM.clap/Contents/MacOS/ArdorNAM'
          for line in subprocess.check_output(['otool', '-L', binary], text=True).splitlines()[1:]:
              path = line.strip().split(' (')[0]
              assert path.startswith(('/System/Library/', '/usr/lib/')), path
          PYTHON
          mkdir -p package
          ditto -c -k --keepParent "$RUNNER_TEMP/ArdorNAM" package/ArdorNAM-macOS-arm64.zip
          (cd package && shasum -a 256 ArdorNAM-macOS-arm64.zip > ArdorNAM-macOS-arm64.zip.sha256)
      - name: Package Linux validation module
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          tar -czf package/ArdorNAM-Linux-x64.tar.gz -C "$RUNNER_TEMP" ArdorNAM
          (cd package && sha256sum ArdorNAM-Linux-x64.tar.gz > ArdorNAM-Linux-x64.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ArdorNAM-package-${{ matrix.os }}
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
