name: Build and release

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  OTA_MINIMUM_BASE_VERSION: '0.1.24'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Calculate release metadata
        id: metadata
        shell: bash
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Generate the conventional changelog
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("apps/manager/package.json", "utf8"));
            pkg.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(".release-package.json", JSON.stringify(pkg));
          '

          npx --yes \
            --package conventional-changelog@8.1.0 \
            --package conventional-changelog-conventionalcommits@10.2.1 \
            conventional-changelog \
            --preset conventionalcommits \
            --pkg .release-package.json \
            --release-count 0 \
            --stdout > .generated-changelog.md

          {
            echo '# Changelog'
            echo
            echo 'All notable changes are generated from Conventional Commit messages.'
            echo
            cat .generated-changelog.md
          } > CHANGELOG.md

          npx --yes \
            --package conventional-changelog@8.1.0 \
            --package conventional-changelog-conventionalcommits@10.2.1 \
            conventional-changelog \
            --preset conventionalcommits \
            --pkg .release-package.json \
            --release-count 1 \
            --stdout > .release-changes.md

          {
            echo "Automated build of main at \`${GITHUB_SHA}\`."
            echo
            cat .release-changes.md
          } > .release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Ardor $RELEASE_VERSION" \
              --notes-file .release-notes.md \
              --draft
          fi

          gh release upload "$RELEASE_TAG" CHANGELOG.md --clobber

      - name: Commit the updated changelog
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${{ steps.metadata.outputs.tag }} [skip ci]"

          if ! git push origin HEAD:main; then
            echo '::warning::main advanced while the changelog was being written; a newer run will update it.'
          fi

  manager-checks:
    name: Check manager app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  device-checks:
    name: Check device software
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/managerd/go.mod
          cache-dependency-path: services/managerd/go.sum

      - name: Test manager daemon and updater
        working-directory: services/managerd
        run: go test ./...

      - name: Configure headless engine
        run: cmake -S . -B build-release-check -DARDOR_UI_BACKEND=none -DCMAKE_BUILD_TYPE=Release

      - name: Build and test headless engine
        run: |
          cmake --build build-release-check --parallel 2
          ctest --test-dir build-release-check --output-on-failure

  firmware:
    name: Build Raspberry Pi image
    needs:
      - prepare
      - manager-checks
      - device-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      ARDOR_BUILDROOT_DL_DIR: ${{ github.workspace }}/.cache/buildroot-dl
      ARDOR_OUTPUT_IMAGE: ${{ github.workspace }}/.cache/firmware/ardor-pedal.img
      ARDOR_CACHED_IMAGE: ${{ github.workspace }}/.cache/firmware/ardor-pedal.img.gz
      ARDOR_RELEASE_IMAGE: ${{ github.workspace }}/artifacts/ardor-pedal-${{ needs.prepare.outputs.version }}.img.gz
      ARDOR_OUTPUT_PAYLOAD_DIR: ${{ github.workspace }}/.cache/firmware/payload
      ARDOR_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ARDOR_RELEASE_COMMIT: ${{ github.sha }}
      ARDOR_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.ARDOR_OTA_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/manager/package-lock.json

      - name: Build the device-hosted Manager
        working-directory: apps/manager
        run: |
          npm ci
          npm run build:device

      - name: Require OTA signing configuration
        env:
          OTA_PRIVATE_KEY: ${{ secrets.ARDOR_OTA_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          test -n "$ARDOR_UPDATE_PUBLIC_KEY_BASE64" || {
            echo '::error::Repository variable ARDOR_OTA_PUBLIC_KEY_BASE64 is required.'
            exit 1
          }
          test -n "$OTA_PRIVATE_KEY" || {
            echo '::error::Repository secret ARDOR_OTA_PRIVATE_KEY_BASE64 is required.'
            exit 1
          }

      - name: Calculate firmware input hash
        id: firmware-inputs
        shell: bash
        run: |
          firmware_hash=$(
            git ls-files -z -- \
              CMakeLists.txt \
              lv_conf.h \
              src \
              third_party \
              apps/audio-probe \
              apps/pedal-poc \
              apps/manager \
              services/managerd \
              ':(glob,exclude)services/managerd/**/*_test.go' \
              ':(glob,exclude)services/managerd/internal/webui/dist/**' \
              buildroot \
              scripts/build-image.sh \
              scripts/build-image-in-container.sh \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d ' ' -f 1
          )
          generated_ui_hash=$(find services/managerd/internal/webui/dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
          firmware_hash=$(printf '%s%s' "$firmware_hash" "$generated_ui_hash" | sha256sum | cut -d ' ' -f 1)
          firmware_hash=$(printf '%s%s' "$firmware_hash" "$ARDOR_UPDATE_PUBLIC_KEY_BASE64" | sha256sum | cut -d ' ' -f 1)
          echo "hash=$firmware_hash" >> "$GITHUB_OUTPUT"

      - name: Restore completed firmware image
        id: firmware-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/firmware/ardor-pedal.img.gz
            .cache/firmware/payload
          key: firmware-image-v2-${{ needs.prepare.outputs.version }}-${{ steps.firmware-inputs.outputs.hash }}

      - name: Cache Buildroot downloads
        if: steps.firmware-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/buildroot-dl
          key: buildroot-dl-${{ hashFiles('buildroot/buildroot-version.env', 'buildroot/external/configs/raspberrypi4_ardor_pedal_defconfig') }}
          restore-keys: |
            buildroot-dl-

      - name: Build the SD-card image
        if: steps.firmware-image-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-image.sh

      - name: Compress the image
        if: steps.firmware-image-cache.outputs.cache-hit != 'true'
        shell: bash
        run: gzip -9 "$ARDOR_OUTPUT_IMAGE"

      - name: Stage the release firmware
        shell: bash
        run: |
          mkdir -p "$(dirname "$ARDOR_RELEASE_IMAGE")"
          cp "$ARDOR_CACHED_IMAGE" "$ARDOR_RELEASE_IMAGE"
          sha256sum "$ARDOR_RELEASE_IMAGE" > "$ARDOR_RELEASE_IMAGE.sha256"

      - name: Set up Go for OTA packaging
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/managerd/go.mod
          cache: false

      - name: Build and sign the device OTA bundle
        working-directory: services/managerd
        env:
          ARDOR_OTA_PRIVATE_KEY_BASE64: ${{ secrets.ARDOR_OTA_PRIVATE_KEY_BASE64 }}
        run: |
          go run ./cmd/ardor-ota-tool bundle \
            -version '${{ needs.prepare.outputs.version }}' \
            -commit '${{ github.sha }}' \
            -minimum-base '${{ env.OTA_MINIMUM_BASE_VERSION }}' \
            -pedal '${{ env.ARDOR_OUTPUT_PAYLOAD_DIR }}/ardor-pedal' \
            -managerd '${{ env.ARDOR_OUTPUT_PAYLOAD_DIR }}/ardor-managerd' \
            -output '${{ github.workspace }}/artifacts'

      - name: Validate OTA release artifacts
        shell: bash
        run: |
          prefix="artifacts/ardor-device-${{ needs.prepare.outputs.version }}-linux-aarch64"
          test -s "$prefix.tar.gz"
          test -s "$prefix.manifest.json"
          test -s "$prefix.manifest.sig"
          (
            cd services/managerd
            go run ./cmd/ardor-ota-tool verify \
              -bundle "../../$prefix.tar.gz" \
              -manifest "../../$prefix.manifest.json" \
              -signature "../../$prefix.manifest.sig"
          )
          file "$ARDOR_OUTPUT_PAYLOAD_DIR/ardor-pedal" | grep -q 'ELF 64-bit.*ARM aarch64'
          file "$ARDOR_OUTPUT_PAYLOAD_DIR/ardor-managerd" | grep -q 'ELF 64-bit.*ARM aarch64'
          file "$ARDOR_OUTPUT_PAYLOAD_DIR/ardor-updater" | grep -q 'ELF 64-bit.*ARM aarch64'

      - name: Upload firmware to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "$ARDOR_RELEASE_IMAGE" \
            "$ARDOR_RELEASE_IMAGE.sha256" \
            artifacts/ardor-device-${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz \
            artifacts/ardor-device-${{ needs.prepare.outputs.version }}-linux-aarch64.manifest.json \
            artifacts/ardor-device-${{ needs.prepare.outputs.version }}-linux-aarch64.manifest.sig \
            --clobber

  publish:
    name: Publish release
    needs:
      - prepare
      - manager-checks
      - firmware
      - device-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
