<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><rect width="1400" height="990" fill="white"/><text x="40" y="55" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#142633" font-weight="bold">ARDOR / BUILD ONLY WHAT YOU NEED</text><text x="40" y="94" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#142633" font-weight="normal">M1 — Five complete boards. Each needs only an external source/host and its listed regulated supply.</text><rect x="40" y="134" width="1320" height="139" rx="9" fill="#f5f7f8" stroke="#dae2e6"/><text x="60" y="163" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#256d85" font-weight="bold">MIDI INPUT</text><text x="520" y="163" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#142633" font-weight="normal">5 V + 3.3 V; chassis terminal local</text><rect x="60" y="180" width="330" height="47" rx="5" fill="white" stroke="#256d85" stroke-width="2"/><text x="74" y="211" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">DIN contacts 4 / 5</text><rect x="520" y="180" width="340" height="47" rx="5" fill="white" stroke="#256d85" stroke-width="2"/><text x="534" y="211" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">H11L1M receiver</text><rect x="995" y="180" width="335" height="47" rx="5" fill="white" stroke="#256d85" stroke-width="2"/><text x="1009" y="211" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">3.3 V UART RX</text><path d="M413,204h66m-12,-8l12,8l-12,8" fill="none" stroke="#256d85" stroke-width="2.5"/><path d="M891,204h66m-12,-8l12,8l-12,8" fill="none" stroke="#256d85" stroke-width="2.5"/><text x="60" y="254" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">No MIDI OUT / no USB</text><text x="995" y="254" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">34 x 28 mm / independent</text><rect x="40" y="289" width="1320" height="139" rx="9" fill="#f5f7f8" stroke="#dae2e6"/><text x="60" y="318" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#5c6b32" font-weight="bold">EXPRESSION</text><text x="520" y="318" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#142633" font-weight="normal">3.3 V; polarity/address/pull-up jumpers local</text><rect x="60" y="335" width="330" height="47" rx="5" fill="white" stroke="#5c6b32" stroke-width="2"/><text x="74" y="366" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">Passive TRS pot</text><rect x="520" y="335" width="340" height="47" rx="5" fill="white" stroke="#5c6b32" stroke-width="2"/><text x="534" y="366" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">ADS1115 + protection</text><rect x="995" y="335" width="335" height="47" rx="5" fill="white" stroke="#5c6b32" stroke-width="2"/><text x="1009" y="366" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">3.3 V I2C host</text><path d="M413,359h66m-12,-8l12,8l-12,8" fill="none" stroke="#5c6b32" stroke-width="2.5"/><path d="M891,359h66m-12,-8l12,8l-12,8" fill="none" stroke="#5c6b32" stroke-width="2.5"/><text x="60" y="409" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">10k–100k linear; no powered CV</text><text x="995" y="409" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">44 x 34 mm / independent</text><rect x="40" y="444" width="1320" height="139" rx="9" fill="#f5f7f8" stroke="#dae2e6"/><text x="60" y="473" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#86572b" font-weight="bold">STEREO BUFFER / MONO MIX</text><text x="520" y="473" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#142633" font-weight="normal">5 V; bias and all output DC blocking local</text><rect x="60" y="490" width="330" height="47" rx="5" fill="white" stroke="#86572b" stroke-width="2"/><text x="74" y="521" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">Stereo line source</text><rect x="520" y="490" width="340" height="47" rx="5" fill="white" stroke="#86572b" stroke-width="2"/><text x="534" y="521" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">Buffers + (L+R)/2</text><rect x="995" y="490" width="335" height="47" rx="5" fill="white" stroke="#86572b" stroke-width="2"/><text x="1009" y="521" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">L / R / MONO line</text><path d="M413,514h66m-12,-8l12,8l-12,8" fill="none" stroke="#86572b" stroke-width="2.5"/><path d="M891,514h66m-12,-8l12,8l-12,8" fill="none" stroke="#86572b" stroke-width="2.5"/><text x="60" y="564" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">Inputs &lt;=1 Vrms; loads &gt;=10k</text><text x="995" y="564" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">40 x 30 mm / independent</text><rect x="40" y="599" width="1320" height="139" rx="9" fill="#f5f7f8" stroke="#dae2e6"/><text x="60" y="628" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#5554a2" font-weight="bold">MONO LINE OUTPUT</text><text x="520" y="628" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#142633" font-weight="normal">5 V + host enable; bias and coupling local</text><rect x="60" y="645" width="330" height="47" rx="5" fill="white" stroke="#5554a2" stroke-width="2"/><text x="74" y="676" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">Mono line source</text><rect x="520" y="645" width="340" height="47" rx="5" fill="white" stroke="#5554a2" stroke-width="2"/><text x="534" y="676" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">Buffer + relay mute</text><rect x="995" y="645" width="335" height="47" rx="5" fill="white" stroke="#5554a2" stroke-width="2"/><text x="1009" y="676" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">TS line / amp feed</text><path d="M413,669h66m-12,-8l12,8l-12,8" fill="none" stroke="#5554a2" stroke-width="2.5"/><path d="M891,669h66m-12,-8l12,8l-12,8" fill="none" stroke="#5554a2" stroke-width="2.5"/><text x="60" y="719" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">No true bypass / no speaker power</text><text x="995" y="719" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">46 x 34 mm / independent</text><rect x="40" y="754" width="1320" height="139" rx="9" fill="#f5f7f8" stroke="#dae2e6"/><text x="60" y="783" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#a43b5b" font-weight="bold">OPTIONAL HEADPHONES</text><text x="520" y="783" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#142633" font-weight="normal">5 V + host enable; all charge-pump parts local</text><rect x="60" y="800" width="330" height="47" rx="5" fill="white" stroke="#a43b5b" stroke-width="2"/><text x="74" y="831" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">Stereo line source</text><rect x="520" y="800" width="340" height="47" rx="5" fill="white" stroke="#a43b5b" stroke-width="2"/><text x="534" y="831" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">TPA6132 + charge pump</text><rect x="995" y="800" width="335" height="47" rx="5" fill="white" stroke="#a43b5b" stroke-width="2"/><text x="1009" y="831" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#142633" font-weight="normal">Stereo TRS headphones</text><path d="M413,824h66m-12,-8l12,8l-12,8" fill="none" stroke="#a43b5b" stroke-width="2.5"/><path d="M891,824h66m-12,-8l12,8l-12,8" fill="none" stroke="#a43b5b" stroke-width="2.5"/><text x="60" y="874" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">Inputs &lt;=1 Vrms; phones &gt;=32 ohm</text><text x="995" y="874" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#142633" font-weight="normal">36 x 30 mm / independent</text><text x="40" y="951" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#142633" font-weight="normal">No carrier or other Ardor module required. Separate PCBA setups repeat costs; build a subset for best economy.</text></svg>
